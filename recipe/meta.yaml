{% set name = "recursivenodes" %}
{% set version = "0.2.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/recursivenodes-{{ version }}.tar.gz
  sha256: 306319eccd818fa239e2dcc60bc8d520b1f594167367675b1481256f43861bc3

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv
  number: 1

requirements:
  host:
    - pip
    - python {{ python_min }}
  run:
    - numpy
    - python >={{ python_min }}

test:
  imports:
    - recursivenodes
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://tisaac.gitlab.io/recursivenodes
  dev_url: https://gitlab.com/tisaac/recursivenodes
  summary: Recursively defined interpolation nodes for the simplex
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - isuruf
